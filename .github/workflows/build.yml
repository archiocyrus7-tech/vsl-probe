name: Build VSL Probe
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ambil header AML
        run: |
          git clone --depth 1 https://github.com/RusJJ/AndroidModLoader.git aml_src
          HDR=$(find aml_src -name amlmod.h | head -1)
          echo "amlmod.h ditemukan di: $HDR"
          test -n "$HDR"
          echo "AML_INC=$(dirname $(dirname $HDR))" >> $GITHUB_ENV
      - name: Kompilasi (armeabi-v7a)
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          "$NDK/ndk-build" NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=Android.mk NDK_APPLICATION_MK=Application.mk AML_INC="$AML_INC"
      - uses: actions/upload-artifact@v4
        with:
          name: libVSLProbe
          path: libs/armeabi-v7a/libVSLProbe.so
